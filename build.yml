name: Build flyme-multitasking

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check macOS build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          command -v dpkg-deb >/dev/null || HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install dpkg
          command -v dpkg-deb

      - name: Verify frozen gesture foundation
        run: |
          chmod +x scripts/verify-frozen-foundation.sh
          scripts/verify-frozen-foundation.sh Tweak.xm

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          command -v ldid

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1 messages=yes
          chmod 755 landscape/layout/DEBIAN/postinst
          make -C landscape clean package FINALPACKAGE=1 messages=yes

      - name: Verify package
        run: |
          package="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          chmod +x scripts/verify-package.sh
          scripts/verify-package.sh "$package"
          landscape_package="$(find landscape/packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$landscape_package"
          chmod +x scripts/verify-landscape-package.sh
          scripts/verify-landscape-package.sh "$landscape_package"
          mkdir -p artifacts
          cp "$package" artifacts/flyme-multitasking_0.9.41_iphoneos-arm64.deb
          cp "$landscape_package" artifacts/flyme-landscape_0.1.0_iphoneos-arm64.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flyme-multitasking-0.9.41-${{ github.run_number }}
          path: |
            artifacts/flyme-multitasking_0.9.41_iphoneos-arm64.deb
            artifacts/flyme-landscape_0.1.0_iphoneos-arm64.deb
          if-no-files-found: error
