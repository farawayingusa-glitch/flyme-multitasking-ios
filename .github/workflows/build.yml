name: Build Flyme multitasking

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check macOS build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          command -v dpkg-deb >/dev/null || brew install dpkg
          command -v dpkg-deb

      - name: Verify frozen gesture foundation
        run: |
          chmod +x scripts/verify-frozen-foundation.sh
          scripts/verify-frozen-foundation.sh Tweak.xm Keyboard.xm

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean package FINALPACKAGE=1 messages=yes

      - name: Verify package
        run: |
          package="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          chmod +x scripts/verify-package.sh
          scripts/verify-package.sh "$package"
          mkdir -p artifacts
          cp "$package" artifacts/Flyme-Multitasking_0.8.10_iphoneos-arm64.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Flyme-Multitasking-0.8.10
          path: artifacts/Flyme-Multitasking_0.8.10_iphoneos-arm64.deb
          if-no-files-found: error
