name: Build flyme-multitasking

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check macOS build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          command -v dpkg-deb >/dev/null || brew install dpkg
          command -v dpkg-deb

      - name: Verify frozen gesture foundation
        run: |
          chmod +x scripts/verify-frozen-foundation.sh
          scripts/verify-frozen-foundation.sh Tweak.xm

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          command -v ldid

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1 messages=yes

      - name: Verify package
        run: |
          package="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          chmod +x scripts/verify-package.sh
          scripts/verify-package.sh "$package"
          mkdir -p artifacts
          cp "$package" artifacts/flyme-multitasking_0.8.69_iphoneos-arm64.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flyme-multitasking-0.8.69
          path: artifacts/flyme-multitasking_0.8.69_iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.69
          name: flyme-multitasking 0.8.69
          body: |
            - NEW: home-indicator dock gesture. Press and hold in the bottom-center zone (instead of swiping up), then keep dragging up: the system app-switcher gesture is intercepted and the app you are using docks straight into the upper-right card
            - Fixed in 0.8.69: the dock gesture now runs on its own transparent zone window instead of the system gesture manager, so a recognized long-press gates the real home gesture off (0.8.68's system-manager recognizer lost the arbitration race and the app switcher still opened)
            - Quick or slow normal up-swipes still open the app switcher as usual; only a stationary long-press captures the gesture
            - Wheel can be summoned in every card mode (centered / docked / hidden): the floating window hosts its own corner-gesture pair, the exclusive close gesture yields the corner trigger, and the docked/hidden pass-through hit-test keeps the corner inside the window
            - Docked transition no longer snaps the app content at the end (host crop stays glued to the shrinking card)
            - Wheel-launching the app already in the card dismisses the card and promotes the app straight to fullscreen
            - Wheel overlay renders and receives touches above the card while presented
          files: artifacts/flyme-multitasking_0.8.69_iphoneos-arm64.deb
          fail_on_unmatched_files: true
