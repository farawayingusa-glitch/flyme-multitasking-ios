name: Build flyme-multitasking

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check macOS build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          command -v dpkg-deb >/dev/null || brew install dpkg
          command -v dpkg-deb

      - name: Verify frozen gesture foundation
        run: |
          chmod +x scripts/verify-frozen-foundation.sh
          scripts/verify-frozen-foundation.sh Tweak.xm

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          command -v ldid

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1 messages=yes

      - name: Verify package
        run: |
          package="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          chmod +x scripts/verify-package.sh
          scripts/verify-package.sh "$package"
          mkdir -p artifacts
          cp "$package" artifacts/flyme-multitasking_0.8.64_iphoneos-arm64.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flyme-multitasking-0.8.64
          path: artifacts/flyme-multitasking_0.8.64_iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.64
          name: flyme-multitasking 0.8.64
          body: |
            - Centered card shape is the baseline (22 pt corner radius); docked card corners scale proportionally with card width (22 * dockWidth / 315), so both modes share one visual shape
            - Transition corner radius stays visually continuous at every scale (interactive drag, settle, travel, fullscreen wrapper)
            - Hidden transition: L-shaped resize grip disappears instantly, no second white strip beside the gliding bar
            - Docked corner radius follows resize/drag changes
          files: artifacts/flyme-multitasking_0.8.64_iphoneos-arm64.deb
          fail_on_unmatched_files: true
